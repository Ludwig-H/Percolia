name: Build 3IA poster
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/poster-3ia.yml'
      - 'Présentations/Posters/3IA_Days_2026/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: poster-3ia-${{ github.ref }}
  cancel-in-progress: true
jobs:
  poster:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read thesis presentation sources
        uses: actions/checkout@v4
        with:
          repository: Ludwig-H/Manuscrit-de-th-se
          ref: 3593fbf25434c4715b37537eae1287bf49239fa7
          path: .references/thesis
          sparse-checkout: Soutenance/soutenance
      - name: Read existing Inria poster template
        uses: actions/checkout@v4
        with:
          repository: Ludwig-H/Generalized-Frangi-for-Automatic-Crack-Extraction-on-FIND-dataset
          ref: 46b40eab4992515b6fde10bb2cd6924b63ab9db6
          path: .references/frangi
          sparse-checkout: EUVIP/poster
      - name: Assemble local working references (no font files)
        run: |
          mkdir -p reference_bundle/defense reference_bundle/template
          cp .references/thesis/Soutenance/soutenance/main.tex reference_bundle/defense/
          cp .references/thesis/Soutenance/soutenance/Soutenance_These_2026-09-08_LouisHauseux.pdf reference_bundle/defense/
          cp -r .references/thesis/Soutenance/soutenance/figs reference_bundle/defense/
          cp -r .references/thesis/Soutenance/soutenance/imgs reference_bundle/defense/
          cp .references/frangi/EUVIP/poster/*.sty reference_bundle/template/
          cp .references/frangi/EUVIP/poster/poster.tex reference_bundle/template/
          cp -r .references/frangi/EUVIP/poster/logos reference_bundle/template/
          find reference_bundle -type f \( -iname '*.ttf' -o -iname '*.otf' -o -iname '*.woff*' \) -delete
      - name: Export reference files
        uses: actions/upload-artifact@v4
        with:
          name: poster-3ia-reference-assets
          path: reference_bundle/
          retention-days: 3
