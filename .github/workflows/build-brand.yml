name: Build brand assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-brand.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install clean parametric sources
        run: python Logo/Oiseau/apply_parametric_redesign.py
      - name: Generate brand assets
        run: |
          python Logo/Police/build_wordmark.py
          python Logo/Oiseau/build_bird.py
          python Logo/build_lockups.py
          python Logo/Oiseau/build_demo.py
      - name: Validate model and assets
        run: |
          python -m py_compile \
            Logo/Police/build_wordmark.py \
            Logo/Oiseau/build_bird.py \
            Logo/Oiseau/build_demo.py \
            Logo/Oiseau/test_wing_model.py \
            Logo/build_lockups.py
          python Logo/Oiseau/test_wing_model.py
          python - <<'PY'
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET

          for path in Path('Logo').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          for path in Path('Logo').rglob('*.svg'):
              ET.parse(path)

          demo = Path('Logo/Oiseau/demo.html').read_text(encoding='utf-8')
          assert '<script src=' not in demo
          assert 'fetch(' not in demo
          assert 'data-flight-bird' in demo
          assert 'Catmull' in demo
          PY
          node --check Logo/Oiseau/bird-animation.js
      - name: Commit clean sources and generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The workflow file is installed in its final form by the payload,
          # but GitHub's job token cannot update workflow files. Keep the
          # bootstrap workflow for this commit; it is replaced afterwards
          # through the authenticated contents API.
          git restore --source=HEAD -- .github/workflows/build-brand.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Repository already up to date."
          else
            git commit -m "Génère le modèle paramétrique de l’oiseau"
            git push
          fi
