name: Build 3IA poster
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/poster-3ia.yml'
      - 'Présentations/Posters/3IA_Days_2026/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: poster-3ia-${{ github.ref }}
  cancel-in-progress: true
jobs:
  poster:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      POSTER: Présentations/Posters/3IA_Days_2026
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install print toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-fonts-recommended fonts-ebgaramond libcairo2
          python -m pip install -r "$POSTER/requirements-build.txt"
      - name: Restore verified assets and vector figures
        working-directory: ${{ env.POSTER }}
        run: |
          python prepare_assets.py
          python make_figures.py
      - name: Compile, check and render A0 poster
        working-directory: ${{ env.POSTER }}
        run: make all check preview
      - name: Commit only poster deliverables to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$POSTER"
          if ! git diff --cached --quiet; then
            git commit -m 'Build checked A0 3IA poster and vendor illustration assets [skip ci]'
            git push origin HEAD:main
          fi
      - name: Export checked PDF and preview
        uses: actions/upload-artifact@v4
        with:
          name: Poster_3IA_2026_A0
          path: |
            Présentations/Posters/3IA_Days_2026/Poster_3IA_2026_Hauseux_A0.pdf
            Présentations/Posters/3IA_Days_2026/apercu.png
          retention-days: 30
