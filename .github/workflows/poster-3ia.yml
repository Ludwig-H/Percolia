name: Build 3IA poster
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/poster-3ia.yml'
      - 'Présentations/Posters/3IA_Days_2026/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: poster-3ia-${{ github.ref }}
  cancel-in-progress: true
jobs:
  poster:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Gather reproducible illustration assets
        run: |
          mkdir -p reference_bundle
          cp Logo/percolia-lockup-horizontal.svg reference_bundle/
          curl -fL --retry 3 https://raw.githubusercontent.com/scikit-learn-contrib/hdbscan/master/notebooks/clusterable_data.npy -o reference_bundle/clusterable_data.npy
          curl -fL --retry 3 https://3ia.univ-cotedazur.eu/uas/3ia-en/LOGO/logo_ai_cluster.png -o reference_bundle/logo_ai_cluster.png
      - name: Export reference files
        uses: actions/upload-artifact@v4
        with:
          name: poster-3ia-vector-inputs
          path: reference_bundle/
          retention-days: 3
