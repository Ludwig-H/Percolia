  </style>

  <style>.sheet-bg{fill:#fff}.cell{fill:none;stroke:#DDE9EE}.guide{stroke:#D4E4EA;stroke-dasharray:4 5}.sheet-label{fill:#5D7385;font:600 18px system-ui,sans-serif}.sheet-title{fill:#082C4C;font:700 28px system-ui,sans-serif}</style>
