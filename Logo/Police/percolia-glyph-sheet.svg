  <title id="title">Percolia Display glyph sheet</title>
  <desc id="desc">Editable construction sheet for the eight custom glyphs used in PERCOLIA.</desc>

  <style>
    .glyph-path{fill:none;stroke:#082C4C;stroke-width:14;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
