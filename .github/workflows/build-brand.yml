name: Build and validate brand assets

on:
  push:
    branches: [main]
    paths:
      - "Logo/**"
      - ".github/workflows/build-brand.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate assets
        run: |
          python Logo/Police/build_wordmark.py
          python Logo/Oiseau/build_bird.py
          python Logo/build_lockups.py
          python Logo/Oiseau/build_demo.py

      - name: Validate model and generated files
        run: |
          python -m py_compile \
            Logo/Police/build_wordmark.py \
            Logo/Oiseau/build_bird.py \
            Logo/Oiseau/build_demo.py \
            Logo/Oiseau/test_wing_model.py \
            Logo/build_lockups.py
          python Logo/Oiseau/test_wing_model.py
          node --check Logo/Oiseau/bird-animation.js
          python - <<'PY'
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET

          for path in Path('Logo').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          for path in Path('Logo').rglob('*.svg'):
              ET.parse(path)

          demo = Path('Logo/Oiseau/demo.html').read_text(encoding='utf-8')
          assert '<script src=' not in demo
          assert 'fetch(' not in demo
          assert 'data-flight-bird="outbound"' in demo
          assert 'data-flight-bird="inbound"' in demo
          assert 'data-animation-clips="true"' in demo
          assert 'TOE-OFF' in demo
          assert 'TOUCHDOWN' in demo
          assert 'PATTES VERROUILLÉES' in demo
          assert 'data-lidar-beam' not in demo
          assert 'data-lidar-ray="true"' not in demo
          assert not any(path.name.startswith('apply_') for path in Path('Logo/Oiseau').glob('*.py'))
          PY

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Generated assets are already up to date."
          else
            git commit -m "Génère les actifs de l’animation keyframée"
            git push
          fi
